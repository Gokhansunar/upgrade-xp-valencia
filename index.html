<style>
:root{--sage:#DCE3D6;--ink:#1D1F1B;--accent:#3E4A3A;--muted:#5d6458;--err:#9b2c2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--sage);color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:24px}
main{width:100%;max-width:380px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;margin-bottom:40px}
.brand img{width:28px;height:28px}
h1{font-weight:500;font-size:clamp(28px,7vw,40px);overflow-wrap:break-word;line-height:1.08;letter-spacing:-.015em;margin:0 0 12px}
p{margin:0 0 28px;color:var(--muted);font-size:16px;line-height:1.5}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1 1 auto;width:100%;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border:1px solid #b9c2b2;border-radius:12px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{flex:none;font:inherit;font-size:16px;font-weight:600;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.msg{min-height:24px;margin-top:12px;font-size:15px}
.msg.err{color:var(--err)}
noscript{display:block;margin-top:16px}
</style>
</head>

function bytes(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function db(){return new Promise(function(res,rej){var r=indexedDB.open("uxp-lock",1);r.onupgradeneeded=function(){r.result.createObjectStore("k")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function getStored(){return db().then(function(d){return new Promise(function(res){var g=d.transaction("k").objectStore("k").get(SALT);g.onsuccess=function(){res(g.result||null)};g.onerror=function(){res(null)}})}).catch(function(){return null})}
function store(k){return db().then(function(d){return new Promise(function(res){var t=d.transaction("k","readwrite");t.objectStore("k").put(k,SALT);t.oncomplete=res;t.onerror=res})}).catch(function(){})}
function open(k){var a=bytes(APP);return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},k,a.slice(12)).then(function(pt){return new TextDecoder().decode(pt)})}
function show(html,k){window.__uxpKey=k;document.open();document.write(html);document.close()}
var f=document.getElementById("uxp-lock-form"),inp=document.getElementById("uxp-code"),btn=document.getElementById("uxp-go"),msg=document.getElementById("uxp-msg");
if(!window.crypto||!crypto.subtle){msg.textContent="Bu tarayıcı sayfayı açamıyor. Güncel bir tarayıcıyla deneyin.";msg.className="msg err";btn.disabled=true;return}
getStored().then(function(k){if(!k){inp.focus();return}return open(k).then(function(h){show(h,k)}).catch(function(){inp.focus()})});
f.addEventListener("submit",function(e){e.preventDefault();var code=inp.value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/ı/g,"i").replace(/\s+/g,"");if(!code)return;
btn.disabled=true;msg.className="msg";msg.textContent="Açılıyor…";
crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]).then(function(b){return crypto.subtle.deriveKey({name:"PBKDF2",salt:SALTB,iterations:ITER,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"])}).then(function(k){return open(k).then(function(h){return store(k).then(function(){show(h,k)})})}).catch(function(){btn.disabled=false;msg.className="msg err";msg.textContent="Kod yanlış. Tekrar deneyin.";inp.select()})});
})();
